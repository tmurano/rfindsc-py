[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "rfindsc"
version = "0.3.8"
description = "Direction-aware panel scoring for single-cell RNA-seq (RFind-sc; Python implementation of the RFindsc R package)"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Tomoyuki Murano", email = "tomoyuki.murano@fujita-hu.ac.jp" }]
keywords = ["single-cell", "scRNA-seq", "gene set scoring", "running fisher", "RFind-sc"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = ["numpy>=1.21", "scipy>=1.7", "pandas>=1.3"]

[project.optional-dependencies]
anndata = ["anndata>=0.8"]
test = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/tmurano/rfindsc-py"
Issues = "https://github.com/tmurano/rfindsc-py/issues"
"R package" = "https://github.com/tmurano/RFindsc"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
rfindsc = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
